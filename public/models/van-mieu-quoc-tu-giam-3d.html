<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b39"><title>Văn Miếu – Quốc Tử Giám – Mô hình 3D</title><link rel="stylesheet" href="lib/model-workshop.css"><link rel="stylesheet" href="lib/realism-quality.css"></head>
<body data-model="van-mieu-quoc-tu-giam"><div id="app"><header><a href="/mo-hinh" target="_top">← Kho mô hình</a><h1 id="title">Văn Miếu – Quốc Tử Giám</h1><button id="fullscreen" aria-label="Trình chiếu toàn màn hình">Toàn màn hình</button></header>
<nav id="toolbar" aria-label="Điều khiển mô hình"><button id="overview">Toàn cảnh</button><button id="rotate" aria-pressed="false">Tự xoay</button><button id="labels-toggle" aria-pressed="true">Nhãn</button><button id="tour-start">Tham quan tự động</button><button id="tour-pause" hidden>Tạm dừng</button><button id="tour-next" hidden>Điểm tiếp</button><button id="tour-stop" hidden>Kết thúc</button><button id="quiz-open">Thử tài</button><span id="tour-status" role="status" aria-live="polite"></span></nav>

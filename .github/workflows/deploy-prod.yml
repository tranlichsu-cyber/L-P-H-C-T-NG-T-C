name: Deploy PRODUCTION to Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - DEPLOY_PRODUCTION_TRIGGER.txt

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VITE_APP_ENV: production
      VITE_DATA_MODE: firebase
      VITE_AI_ENABLED: 'true'
      VITE_AI_MODE: real
      VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VITE_FIREBASE_API_KEY: 'AIzaSyDpn1buNzqmHZagonLNs0aXLcCKVWHzixk'
      VITE_FIREBASE_AUTH_DOMAIN: 'lop-hoc-tuong-tac-a62a5.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'lop-hoc-tuong-tac-a62a5'
      VITE_FIREBASE_STORAGE_BUCKET: 'lop-hoc-tuong-tac-a62a5.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '153547343535'
      VITE_FIREBASE_APP_ID: '1:153547343535:web:8745a8e3b34c956507b65a'
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Gemini AI configuration
        shell: bash
        run: |
          if [ -z "$VITE_GEMINI_API_KEY" ]; then
            echo "::error::Missing production secret GEMINI_API_KEY. AI question generation cannot use Gemini."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify authentication environment
        shell: bash
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lop-hoc-tuong-tac-a62a5

      - name: Enable Gemini and API Keys APIs
        shell: bash
        run: |
          gcloud services enable generativelanguage.googleapis.com apikeys.googleapis.com --project=lop-hoc-tuong-tac-a62a5 --quiet

      - name: Allow Gemini API on production API key
        shell: bash
        run: |
          KEY_NAME=$(gcloud services api-keys lookup "$VITE_GEMINI_API_KEY" --format='value(name)')
          if [ -z "$KEY_NAME" ]; then
            echo "::error::Could not resolve the production Gemini API key resource."
            exit 1
          fi

          gcloud services api-keys update "$KEY_NAME" \
            --append \
            --api-target=service=generativelanguage.googleapis.com \
            --allowed-referrers="https://lop-hoc-tuong-tac-a62a5.web.app/*,https://lop-hoc-tuong-tac-a62a5.firebaseapp.com/*" \
            --no-check-existing-usage \
            --quiet

      - name: Probe Gemini API permission
        shell: bash
        run: |
          set +e
          BODY_FILE="$(mktemp)"
          HTTP_CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -H "x-goog-api-key: $VITE_GEMINI_API_KEY"             "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"             -d '{"contents":[{"parts":[{"text":"Reply with the single word OK."}]}]}')
          echo "Gemini probe HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            node -e "
              const fs=require('fs');
              try {
                const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
                const e=j.error||{};
                console.log('Gemini error status:', e.status||'unknown');
                console.log('Gemini error message:', e.message||'unknown');
                if (Array.isArray(e.details)) {
                  for (const d of e.details) {
                    if (d.reason) console.log('Gemini error reason:', d.reason);
                    if (d.metadata) {
                      const safe={};
                      for (const [k,v] of Object.entries(d.metadata)) {
                        if (!/key|credential|token/i.test(k)) safe[k]=v;
                      }
                      if (Object.keys(safe).length) console.log('Gemini error metadata:', JSON.stringify(safe));
                    }
                  }
                }
              } catch {
                console.log('Gemini returned a non-JSON error body.');
              }
            " "$BODY_FILE"
            exit 1
          fi

          echo "Gemini production key is authorized."

      - name: Deploy PRODUCTION
        run: npx firebase-tools@15.32.1 deploy --only hosting,firestore:rules,firestore:indexes --project lop-hoc-tuong-tac-a62a5 --non-interactive

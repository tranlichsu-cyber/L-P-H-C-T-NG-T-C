name: Deploy PRODUCTION to Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - DEPLOY_PRODUCTION_TRIGGER.txt

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VITE_APP_ENV: production
      VITE_DATA_MODE: firebase
      VITE_FIREBASE_API_KEY: 'AIzaSyDpn1buNzqmHZagonLNs0aXLcCKVWHzixk'
      VITE_FIREBASE_AUTH_DOMAIN: 'lop-hoc-tuong-tac-a62a5.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'lop-hoc-tuong-tac-a62a5'
      VITE_FIREBASE_STORAGE_BUCKET: 'lop-hoc-tuong-tac-a62a5.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '153547343535'
      VITE_FIREBASE_APP_ID: '1:153547343535:web:8745a8e3b34c956507b65a'
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check student practice and Word worksheets
        run: |
          for check in check-games check-worksheet-report check-activities check-gk1-exams check-self-practice-scores check-catalogue check-student-self-practice check-read-efficiency check-writing-practice check-curriculum check-curriculum-corrections check-tradition-quizzes check-history-articles check-heritage-catalog check-tradition-map check-worksheets; do
            if ! node "scripts/$check.mjs" > "$RUNNER_TEMP/$check.log" 2>&1; then
              cat "$RUNNER_TEMP/$check.log"
              node -e 'const fs=require("fs");const log=fs.readFileSync(process.argv[1],"utf8").slice(-6000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error::"+log)' "$RUNNER_TEMP/$check.log"
              exit 1
            fi
            cat "$RUNNER_TEMP/$check.log"
          done

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Firestore student access rules
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/self-practice-rule-tools" --no-audit --no-fund firebase-tools@15.32.1 @firebase/rules-unit-testing@6.0.0 firebase@13.0.0
          export NODE_PATH="$RUNNER_TEMP/self-practice-rule-tools/node_modules"
          if ! "$RUNNER_TEMP/self-practice-rule-tools/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-self-practice 'node scripts/check-self-practice-rules.cjs' > "$RUNNER_TEMP/self-practice-rules.log" 2>&1; then
            cat "$RUNNER_TEMP/self-practice-rules.log"
            node -e 'const fs=require("fs");const log=fs.readFileSync(process.argv[1],"utf8").slice(-10000).replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A");console.log("::error::"+log)' "$RUNNER_TEMP/self-practice-rules.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/self-practice-rules.log"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify authentication environment
        shell: bash
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lop-hoc-tuong-tac-a62a5

      - name: Deploy PRODUCTION
        run: npx firebase-tools@15.32.1 deploy --only hosting,firestore:rules,firestore:indexes --project lop-hoc-tuong-tac-a62a5 --non-interactive

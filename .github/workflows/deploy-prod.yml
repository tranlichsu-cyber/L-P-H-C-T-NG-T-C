name: Deploy PRODUCTION to Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      VITE_APP_ENV: production
      VITE_DATA_MODE: firebase
      VITE_AI_ENABLED: 'true'
      VITE_AI_MODE: gemini
      VITE_FIREBASE_API_KEY: 'AIzaSyDpn1buNzqmHZagonLNs0aXLcCKVWHzixk'
      VITE_FIREBASE_AUTH_DOMAIN: 'lop-hoc-tuong-tac-a62a5.firebaseapp.com'
      VITE_FIREBASE_PROJECT_ID: 'lop-hoc-tuong-tac-a62a5'
      VITE_FIREBASE_STORAGE_BUCKET: 'lop-hoc-tuong-tac-a62a5.firebasestorage.app'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '153547343535'
      VITE_FIREBASE_APP_ID: '1:153547343535:web:8745a8e3b34c956507b65a'
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Require production service account
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_PROD secret."
            echo "Add the Firebase production service account JSON in GitHub Environment: production."
            exit 1
          fi

      - name: Write Firebase service account
        shell: bash
        run: |
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}" > "${{ runner.temp }}/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy PRODUCTION
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project lop-hoc-tuong-tac-a62a5 --non-interactive

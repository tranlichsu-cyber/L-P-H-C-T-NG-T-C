name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test Cloud Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          node --check functions/src/index.js
          npm test --prefix functions

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

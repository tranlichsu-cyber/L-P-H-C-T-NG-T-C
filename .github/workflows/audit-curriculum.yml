name: Read published curriculum for textbook audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [AUDIT_CURRICULUM_TRIGGER.txt]
permissions:
  contents: read
jobs:
  read-published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read only already-public practice content
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {gzipSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const token=execFileSync('gcloud',['auth','print-access-token'],{encoding:'utf8'}).trim();
          const response=await fetch('https://firestore.googleapis.com/v1/projects/lop-hoc-tuong-tac-a62a5/databases/(default)/documents:runQuery',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({structuredQuery:{from:[{collectionId:'selfPracticeQuizzes'}],where:{fieldFilter:{field:{fieldPath:'published'},op:'EQUAL',value:{booleanValue:true}}}}})});
          if(!response.ok){
            console.log('::error::Published query failed: '+response.status+' '+(await response.text()).replace(/%/g,'%25').replace(/\n/g,'%0A'));
            if(response.status===429){
              const probe=await fetch('https://firestore.googleapis.com/v1/projects/lop-hoc-tuong-tac-a62a5/databases/(default)/documents:runQuery',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({structuredQuery:{from:[{collectionId:'selfPracticeQuizzes'}],where:{fieldFilter:{field:{fieldPath:'published'},op:'EQUAL',value:{booleanValue:true}}},limit:1}})});
              console.log('::notice title=CURRICULUM_SINGLE_READ::'+probe.status+' '+(await probe.text()).replace(/%/g,'%25').replace(/\n/g,'%0A'));
            }
            process.exit(1);
          }
          const result=await response.json();
          function decode(value){if('mapValue'in value)return Object.fromEntries(Object.entries(value.mapValue.fields||{}).map(([key,item])=>[key,decode(item)]));if('arrayValue'in value)return (value.arrayValue.values||[]).map(decode);if('integerValue'in value)return Number(value.integerValue);if('doubleValue'in value)return value.doubleValue;if('nullValue'in value)return null;return Object.values(value)[0];}
          const items=result.filter(row=>row.document).map(row=>({id:row.document.name.split('/').at(-1),...decode({mapValue:{fields:row.document.fields}})}));
          const payload=gzipSync(JSON.stringify(items)).toString('base64');
          const chunkSize=55000;
          const parts=Math.ceil(payload.length/chunkSize);
          if(parts>8)throw Error('Public snapshot too large for annotations; use artifact retrieval.');
          console.log('::notice title=CURRICULUM_COUNT::'+items.length+' public quizzes, '+parts+' snapshot parts.');
          for(let i=0;i<parts;i++)console.log('::notice title=CURRICULUM_SNAPSHOT_'+String(i).padStart(3,'0')+'::'+payload.slice(i*chunkSize,(i+1)*chunkSize));
          JS

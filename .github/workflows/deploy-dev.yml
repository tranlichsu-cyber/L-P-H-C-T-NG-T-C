name: Deploy DEV to Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    env:
      VITE_APP_ENV: development
      VITE_DATA_MODE: firebase
      VITE_AI_ENABLED: ${{ vars.VITE_AI_ENABLED || 'false' }}
      VITE_AI_MODE: ${{ vars.VITE_AI_MODE || 'mock' }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write Firebase service account
        shell: bash
        run: |
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT_LHTT_DEV }}" > "${{ runner.temp }}/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy DEV
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project lhtt-dev --non-interactive
